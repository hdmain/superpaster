name: Build .deb

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: Build Debian package
    # 22.04 keeps glibc older and avoids Ubuntu 24.04 *t64-only auto-deps
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-svg-dev \
            libx11-dev \
            libgl1-mesa-dev \
            file \
            dpkg-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          ls -lh *.deb
          echo "---- control ----"
          dpkg-deb -I *.deb
          echo "---- Depends ----"
          dpkg-deb -f *.deb Depends
          echo "---- contents ----"
          dpkg-deb -c *.deb | head -n 40

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: spaste-deb
          path: build/*.deb
          if-no-files-found: error

      - name: Attach .deb to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" build/*.deb --clobber
